services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kursa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kursa_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-kursa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # Debe coincidir con POSTGRES_USER / POSTGRES_DB del .env
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      EXP_TOKEN: ${EXP_TOKEN:-30}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ENABLE_DEV_ROUTES: ${ENABLE_DEV_ROUTES:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_uploads:
